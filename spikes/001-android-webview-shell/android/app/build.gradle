apply plugin: 'com.android.application'

def t3Release = new groovy.json.JsonSlurper().parse(file('../../../../release.json'))

// Private signing material lives outside the checkout. CI may override each
// value through its secret environment; missing credentials never fall back
// to the debug certificate or silently produce an unsigned release.
def signingPropertiesPath = System.getenv('T3_ANDROID_SIGNING_PROPERTIES') ?: new File(System.getProperty('user.home'), '.t3/signing/android-release.properties').absolutePath
def releaseSigningProperties = new Properties()
def signingPropertiesFile = new File(signingPropertiesPath)
if (signingPropertiesFile.isFile()) {
    signingPropertiesFile.withInputStream { releaseSigningProperties.load(it) }
}
def signingValue = { String environment, String property -> System.getenv(environment) ?: releaseSigningProperties.getProperty(property) }
def releaseStorePath = signingValue('T3_ANDROID_STORE_FILE', 'storeFile')
def releaseStorePassword = signingValue('T3_ANDROID_STORE_PASSWORD', 'storePassword')
def releaseKeyAlias = signingValue('T3_ANDROID_KEY_ALIAS', 'keyAlias')
def releaseKeyPassword = signingValue('T3_ANDROID_KEY_PASSWORD', 'keyPassword')
gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.project == project && it.name.toLowerCase().contains('release') }
        && (!releaseStorePath || !new File(releaseStorePath).isFile() || !releaseStorePassword || !releaseKeyAlias || !releaseKeyPassword)) {
        throw new GradleException('Release signing is missing. Configure T3_ANDROID_SIGNING_PROPERTIES or the T3_ANDROID_* signing environment variables. Never use the debug key for distribution.')
    }
}

android {
    namespace = "com.speechless666.t3.spike"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.speechless666.t3.spike"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode t3Release.androidVersionCode as int
        versionName t3Release.version
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    testOptions { unitTests.includeAndroidResources = true }
    signingConfigs {
        release {
            if (releaseStorePath) storeFile = new File(releaseStorePath)
            storePassword = releaseStorePassword
            keyAlias = releaseKeyAlias
            keyPassword = releaseKeyPassword
        }
    }
    buildTypes {
        debug {
            versionNameSuffix '-dev'
        }
        release {
            debuggable false
            jniDebuggable false
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    implementation "com.journeyapps:zxing-android-embedded:4.3.0"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "androidx.work:work-runtime:2.10.1"
    testImplementation "androidx.work:work-testing:2.10.1"
    testImplementation "org.json:json:20240303"
    testImplementation "org.robolectric:robolectric:4.14.1"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

// Single shared current-kind contract. Generated into build/, never Capacitor copied assets.
def nativeContractInput = file('../../../../packages/shared/src/schemas/native-mutation-contract.ts')
def nativeContractOutput = layout.buildDirectory.dir('generated/nativeMutationContract')
tasks.register('generateNativeMutationContract') {
    inputs.file(nativeContractInput)
    outputs.dir(nativeContractOutput)
    doLast {
        def source = nativeContractInput.text
        def json = groovy.json.JsonOutput.toJson(new groovy.json.JsonSlurper().parseText(source.substring(source.indexOf('{'), source.lastIndexOf('}') + 1)))
        def target = new File(nativeContractOutput.get().asFile, 'com/speechless666/t3/spike/NativeMutationContract.java')
        target.parentFile.mkdirs()
        target.text = 'package com.speechless666.t3.spike; final class NativeMutationContract { static final String JSON = ' + groovy.json.JsonOutput.toJson(json) + '; }'
    }
}
android.sourceSets.main.java.srcDir(nativeContractOutput)
tasks.named('preBuild').configure { dependsOn('generateNativeMutationContract') }

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="T³ personal collection index" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Bump `?v=` when the artwork changes: a browser keeps favicons in a cache of its own
         that a reload does not touch, so the URL has to change for a new one to appear. -->
    <link rel="icon" href="/favicon.ico?v=2" sizes="any" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png?v=2" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=2" />
    <title>T³</title>
    <style>
      /*
        The first paint: T³'s own icon on white, from the very first frame. It is inline
        and in the document rather than built by the bundle, so it is already there while
        the app is still loading; `src/boot-overlay.ts` takes it away once the app has
        settled. Effects beyond this can be added later.
      */
      #t3-boot { position: fixed; inset: 0; z-index: 2147483647; display: grid; place-items: center; background: #ffffff; }
      /*
        The same icon at the same size and on the same centre as the launch screen's, so the
        hand-over between them has nothing to move. The system draws its icon scaled into a
        288dp box and the icon generator scales the drawing to 0.62 of its own box, so that
        product is the size the launch screen shows — and `viewport-fit=cover` above is what
        puts this viewport on the screen's own centre, the way the launch screen is. Measured
        on the phone: both frames draw the icon at 540 device px centred on y 1206.
      */
      #t3-boot img { width: calc(288px * 0.62); height: auto; }
      #t3-boot.is-leaving { opacity: 0; transition: opacity 220ms ease; }
      #t3-boot[hidden] { display: none; }
      @media (prefers-reduced-motion: reduce) { #t3-boot.is-leaving { transition: none; } }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="t3-boot" role="status" aria-live="polite">
      <img src="/icons/boot.png" alt="" width="140" height="140" />
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

[project]
name = "generic-probe"
version = "0.1.0"
description = "SiteProbe: per-site adapters under <T3 user data>/siteprobe/, one generic extractor"
requires-python = ">=3.11"
dependencies = [
  "opencc-python-reimplemented>=0.1.7",
]

[project.optional-dependencies]
# Only the 18comic crawl method needs these; the generic layer and the other two
# sites run on the standard library alone.
# curl_cffi is what lets a plain request pass the site's bot check; playwright is
# only the fallback when no usable clearance exists.
browser = ["playwright>=1.50,<2", "httpx>=0.27,<1", "curl_cffi>=0.7"]
media = ["pillow>=12.3.0"]
dev = ["pytest>=8,<9"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src", "src.generic", "src.builder"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
